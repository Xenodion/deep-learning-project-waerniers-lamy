[project]
name = "deep-learning-project-waerniers-lamy"
version = "0.1.0"
description = "Museum guide: genre recognition (fine-tuned ResNet-18) and natural-language collection search (SigLIP)"
readme = "README.md"
authors = [
    { name = "Xenodion", email = "alexandre.waerniers@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
deep-learning-project-waerniers-lamy = "deep_learning_project_waerniers_lamy:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
